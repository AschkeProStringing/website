name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Produktdaten prüfen
        run: python scripts/products.py check
      - name: Angebots-PDF aus data/products.json erzeugen
        run: python scripts/build_pdf.py Angebot.pdf
      - name: Veröffentlichungsordner zusammenstellen
        run: |
          mkdir _site
          cp -r index.html anfrage.html impressum.html datenschutz.html Angebot.pdf assets data _site/
          touch _site/.nojekyll
      - name: Vorschau-Paket (zum Herunterladen, auch bei privatem Repo)
        uses: actions/upload-artifact@v4
        with:
          name: website-vorschau
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: _site
      - id: deployment
        if: ${{ !github.event.repository.private }}
        uses: actions/deploy-pages@v4
