name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Produktdaten prüfen
        run: python scripts/products.py check
      - name: Angebots-PDF aus data/products.json erzeugen
        run: python scripts/build_pdf.py AschkeBesaitungsserviceAngebot.pdf
      - name: Veröffentlichungsordner zusammenstellen
        run: |
          mkdir _site
          cp -r index.html anfrage.html impressum.html datenschutz.html AschkeBesaitungsserviceAngebot.pdf sitemap.xml robots.txt assets data _site/
          touch _site/.nojekyll
      - name: Vorschau-Paket (zum Herunterladen, auch bei privatem Repo)
        uses: actions/upload-artifact@v7
        with:
          name: website-vorschau
          path: _site
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !github.event.repository.private }}
        with:
          path: _site

  # Nur für das öffentliche Repository "website": im privaten Repo wird nichts veröffentlicht
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
